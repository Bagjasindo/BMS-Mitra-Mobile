name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Browser smoke test
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "Chromium/Chrome not found on runner" >&2
            exit 1
          fi
          mkdir -p tests/output
          set -o pipefail
          BMS_TEST_CHROMIUM="$BROWSER" npm run test:browser 2>&1 | tee tests/output/browser-smoke.log
      - name: Upload browser smoke failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: tests/output/
