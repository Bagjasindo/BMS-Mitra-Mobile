<!doctype html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMS Mobile</title><meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BMS Mobile"><meta name="apple-touch-fullscreen" content="yes"><link rel="apple-touch-icon" href="./assets/bms_login_logo.jpg"><link rel="manifest" href="./manifest.webmanifest?v=3"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://unpkg.com" crossorigin><link rel="preconnect" href="https://mqqrfhwqgcpkjeaasdsr.supabase.co" crossorigin><link rel="stylesheet" href="./style.css?v=2325-pwa-desktop"></head>
<body><div id="app"><main class="login"><h1>BMS Mitra Online</h1><p>Memuat aplikasi…</p></main></div>
<script>
(function(){
  const app=document.getElementById('app');
  const setStatus=(text,isError=false)=>{
    if(!app)return;
    app.innerHTML='<main class="login"><h1>BMS Mitra Online</h1><p'+(isError?' class="error"':'')+'>'+text+'</p></main>';
  };
  setStatus('Menyiapkan aplikasi…');
  const loadScript=(src,timeoutMs)=>new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>{
      if(done)return;
      done=true;
      s.remove();
      reject(new Error('timeout '+src));
    },timeoutMs);
    s.src=src;
    s.onload=()=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      resolve();
    };
    s.onerror=()=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      s.remove();
      reject(new Error('gagal '+src));
    };
    document.head.appendChild(s);
  });
  (async()=>{
    try{
      try{
        await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js',5000);
      }catch(_){
        await loadScript('https://unpkg.com/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js',5000);
      }
      if(!window.supabase?.createClient)throw new Error('Supabase tidak tersedia');
      await loadScript('./main-2321.js?v=2324-save-feedback',10000);
    }catch(error){
      console.error(error);
      setStatus('Gagal memuat komponen aplikasi. Periksa koneksi lalu muat ulang halaman.',true);
    }
  })();
})();
</script>
<script>
if('serviceWorker' in navigator){
  let bmsSwReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(bmsSwReloaded)return;
    bmsSwReloaded=true;
    location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js?v=3',{scope:'./'}).then(reg=>{
      reg.update().catch(()=>{});
      if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker)return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller){
            worker.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
    }).catch(()=>{});
  });
}
</script></body></html>
